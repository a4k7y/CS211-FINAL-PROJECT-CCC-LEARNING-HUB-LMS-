<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#15243a">
	<title>Forgot Password | CCC Learning Hub</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../js/auth.js" defer></script>
</head>

<body class="auth-page" data-page="forgot-password">
	<main class="auth-shell">
		<section class="brand-panel" aria-label="CCC Learning Hub">
			<a class="brand-mark" href="../index.html" aria-label="CCC Learning Hub home">
				<span class="brand-name">CCC <span>Learning Hub</span></span>
			</a>
			<div class="brand-copy">
				<p class="eyebrow">Account recovery</p>
				<h1>Back to your<br>learning journey.</h1>
				<p>Get help accessing your CCC Learning Hub account.</p>
			</div>
			<p class="copyright">&copy; 2026 CCC Learning Hub</p>
		</section>

		<section class="form-panel" aria-labelledby="forgot-password-title">
			<div class="form-wrap">
				<p class="eyebrow form-eyebrow">Need a hand?</p>
				<h2 id="forgot-password-title">Forgot your password?</h2>
				<p class="form-intro">Enter your CCC email address to get help recovering your account.</p>
				<form id="forgot-password-form" novalidate>
					<label for="email">CCC email</label>
					<input id="email" name="email" type="email" autocomplete="email" placeholder="name@ccc.edu.ph"
						required>

					<p class="form-message" id="form-message" role="status" aria-live="polite"></p>
					<button class="primary-button" type="submit">Request help <span
							aria-hidden="true">&#8594;</span></button>
				</form>
				<p class="switch-prompt"><a href="login.html">Back to sign in</a></p>
			</div>
		</section>
	</main>
</body>

</html>
